<text x="422" y="364" class="body" text-anchor="start">parse → tokenize → reserve shared pages</text>
<text x="422" y="382" class="body" text-anchor="start">radix lookup chooses the uncached suffix</text>
<text x="422" y="400" class="body" text-anchor="start">scheduler admits one of four resident lanes</text>
